name: Build MrClean macOS (.dmg)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest # Runner resmi GitHub Actions Apple Silicon M-series
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install System Dependencies (Tkinter & create-dmg)
        run: |
          brew install python-tk@3.13 create-dmg || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Automated Test Suite (100% PASS Gate)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Application (.app & .dmg)
        run: |
          python build_mac.py

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MrClean-macOS-Installer
          path: dist/MrClean-macOS.dmg
          if-no-files-found: warn

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MrClean-macOS.dmg
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
